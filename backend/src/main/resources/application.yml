spring:
  application:
    name: servicedesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${SPRING_DATASOURCE_USERNAME:servicedesk_user}
    password: ${SPRING_DATASOURCE_PASSWORD:servicedesk_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

# Security and CORS configuration properties
app:
  security:
    # Required: no default, so the app refuses to start without a private signing key.
    jwt-secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    google:
      # OAuth 2.0 Web client id from Google Cloud Console; empty disables Google sign-in.
      client-id: ${GOOGLE_CLIENT_ID:}
      # Optional comma-separated Google Workspace domains allowed to sign in (e.g. example.edu).
      allowed-domains: ${GOOGLE_ALLOWED_DOMAINS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Only behind a known reverse proxy: otherwise clients could choose their own address.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    auth-per-minute: 10
    ai-per-minute: 20
    write-per-minute: 120
    api-per-minute: 600
    login:
      max-failures: 5
      window-minutes: 15
      lockout-minutes: 15
  demo-accounts:
    # Seeded demo accounts share a documented password; they're deactivated unless this is true.
    enabled: ${DEMO_ACCOUNTS_ENABLED:false}
  root:
    username: ${ROOT_USERNAME:root}
    # Only used to create the root account when none exists yet.
    password: ${ROOT_PASSWORD:}
