spring:
  application:
    name: servicedesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${SPRING_DATASOURCE_USERNAME:servicedesk_user}
    password: ${SPRING_DATASOURCE_PASSWORD:servicedesk_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

# Security and CORS configuration properties
app:
  security:
    jwt-secret: ${JWT_SECRET:default_jwt_secret_key_minimum_thirty_two_bytes_long}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    google:
      # OAuth 2.0 Web client id from Google Cloud Console; empty disables Google sign-in.
      client-id: ${GOOGLE_CLIENT_ID:}
      # Optional comma-separated Google Workspace domains allowed to sign in (e.g. example.edu).
      allowed-domains: ${GOOGLE_ALLOWED_DOMAINS:}
  root:
    username: ${ROOT_USERNAME:root}
    # Only used to create the root account when none exists yet.
    password: ${ROOT_PASSWORD:}
