spring:
  application:
    name: servicedesk-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: -1

app:
  # Generous limits so ordinary tests are never throttled; RateLimitingTest sets its own.
  rate-limit:
    auth-per-minute: 10000
    ai-per-minute: 10000
    write-per-minute: 10000
    api-per-minute: 10000
    events-per-minute: 10000
    login:
      max-failures: 1000
  security:
    jwt-secret: test_secret_key_minimum_thirty_two_characters_long_for_unit_tests
    cors:
      allowed-origins: http://localhost:3000

logging:
  level:
    com.tngtech.archunit: ERROR
